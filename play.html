<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prof. Memmo - Game Player</title>
  
  <!-- PWA & Mobile Web App Meta Tags per Schermo Intero Safari iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prof. Memmo">
  <meta name="theme-color" content="#0a0d18">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04060c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
      background-color: #04060c;
    }
    /* Pulsante fluttuante discreto per tornare all'Hub/Vetrina */
    .btn-floating-hub {
      position: fixed;
      top: calc(env(safe-area-inset-top, 8px) + 8px);
      left: 12px;
      z-index: 99999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-floating-hub:hover, .btn-floating-hub:active {
      opacity: 1;
      transform: scale(1.04);
      background: rgba(30, 41, 59, 0.95);
      color: #38bdf8;
    }
    /* Loading overlay */
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #04060c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      color: #eab308;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 179, 8, 0.2);
      border-top-color: #eab308;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Pulsante discreto per tornare all'Hub dall'app PWA -->
  <button type="button" class="btn-floating-hub" onclick="tornaAllHub()" title="Torna all'Hub">
    <i class="ph ph-arrow-left" style="font-size: 0.95rem;"></i>
    <span>Hub</span>
  </button>

  <!-- Indicatore di caricamento -->
  <div id="loading-indicator">
    <div class="spinner"></div>
    <span style="font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px;">Caricamento Gioco...</span>
  </div>

  <!-- Iframe a schermo intero nativo -->
  <iframe id="game-frame" 
          src="about:blank" 
          allow="autoplay; fullscreen; microphone; camera; clipboard-write" 
          onload="nascondiLoading()">
  </iframe>

  <script>
    const GAME_URLS = {
      'la-rotta-degli-eroi': 'https://prof-memmo.github.io/la-rotta-degli-eroi/',
      'fantaletteratura': 'https://prof-memmo.github.io/fantaletteratura/',
      'la-corte-della-commedia': 'https://prof-memmo.github.io/la-corte-della-commedia/',
      'palestra-di-riflessione': 'https://prof-memmo.github.io/palestra-di-riflessione/',
      'historygram': 'https://prof-memmo.github.io/historygram/',
      'l-oratore': 'https://prof-memmo.github.io/l-oratore/',
      'la-ruota-geografica': 'https://prof-memmo.github.io/la-ruota-geografica/'
    };

    function getTargetUrl() {
      const params = new URLSearchParams(window.location.search);
      const game = params.get('game') || 'la-rotta-degli-eroi';
      const isPreview = window.location.pathname.indexOf('/preview') !== -1 || params.get('preview') === '1';

      let targetBase = GAME_URLS[game] || ('https://prof-memmo.github.io/' + game + '/');
      if (isPreview) {
        targetBase = targetBase.replace(/\/$/, '') + '/preview/';
      }
      return targetBase;
    }

    function initPlayer() {
      const target = getTargetUrl();
      const frame = document.getElementById('game-frame');
      frame.src = target;

      // Timeout di sicurezza per nascondere il loading se onload tarda
      setTimeout(nascondiLoading, 2500);
    }

    function nascondiLoading() {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 300);
      }
    }

    function tornaAllHub() {
      const isPreview = window.location.pathname.indexOf('/preview') !== -1;
      const targetPage = isPreview ? 'giochi.html' : 'giochi.html';
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = targetPage;
      }
    }

    window.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
