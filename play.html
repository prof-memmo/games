<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prof. Memmo - Game Player</title>
  
  <!-- PWA & Mobile Web App Meta Tags per Schermo Intero Safari iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prof. Memmo">
  <meta name="theme-color" content="#0a0d18">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04060c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
      background-color: #04060c;
    }
    /* Loading overlay */
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #04060c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      color: #eab308;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 179, 8, 0.2);
      border-top-color: #eab308;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Indicatore di caricamento -->
  <div id="loading-indicator">
    <div class="spinner"></div>
    <span style="font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px;">Caricamento Gioco...</span>
  </div>

  <!-- Iframe a schermo intero nativo -->
  <iframe id="game-frame" 
          src="about:blank" 
          allow="autoplay; fullscreen; microphone; camera; clipboard-write" 
          onload="onFrameLoaded()">
  </iframe>

  <script>
    const GAME_URLS = {
      'la-rotta-degli-eroi': 'https://prof-memmo.github.io/la-rotta-degli-eroi/',
      'fantaletteratura': 'https://prof-memmo.github.io/fantaletteratura/',
      'la-corte-della-commedia': 'https://prof-memmo.github.io/la-corte-della-commedia/',
      'palestra-di-riflessione': 'https://prof-memmo.github.io/palestra-di-riflessione/',
      'historygram': 'https://prof-memmo.github.io/historygram/',
      'l-oratore': 'https://prof-memmo.github.io/l-oratore/',
      'la-ruota-geografica': 'https://prof-memmo.github.io/la-ruota-geografica/',
      'ops-storia': 'https://prof-memmo.github.io/ops-storia/'
    };

    function getTargetUrl() {
      const params = new URLSearchParams(window.location.search);
      const game = params.get('game') || 'la-rotta-degli-eroi';
      const isPreview = window.location.pathname.indexOf('/preview') !== -1 || params.get('preview') === '1';

      let targetBase = GAME_URLS[game] || ('https://prof-memmo.github.io/' + game + '/');
      if (isPreview) {
        targetBase = targetBase.replace(/\/$/, '') + '/preview/';
      }
      return targetBase;
    }

    function initPlayer() {
      const target = getTargetUrl();
      const frame = document.getElementById('game-frame');
      frame.src = target;

      // Timeout di sicurezza per nascondere il loading se onload tarda
      setTimeout(nascondiLoading, 2500);
    }

    function nascondiLoading() {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 300);
      }
    }

    function tornaAllHub() {
      const isPreview = window.location.pathname.indexOf('/preview') !== -1;
      const targetPage = isPreview ? 'giochi.html' : 'giochi.html';
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = targetPage;
      }
    }

    // Ascolto messaggi postMessage dal gioco se inviati
    window.addEventListener('message', function(event) {
      if (event.data && (event.data.action === 'tornaAllHub' || event.data.action === 'returnToHub')) {
        tornaAllHub();
      }
    });

    function attachHubTriggerToIframe() {
      try {
        const frame = document.getElementById('game-frame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc) return;

        // 1. Clic diretto sul logo o wrapper avatar Prof. Memmo (ritorno nativo all'Hub)
        const profLogos = doc.querySelectorAll('.header-prof-logo-wrapper, .header-center-logo, .header-prof-logo');
        profLogos.forEach(function(el) {
          el.style.cursor = 'pointer';
          el.setAttribute('title', "Torna all'Hub Giochi Prof. Memmo");
          el.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            tornaAllHub();
          }, true);
        });
      } catch (err) {
        console.warn("Iframe same-origin trigger note:", err);
      }
    }

    function onFrameLoaded() {
      nascondiLoading();
      attachHubTriggerToIframe();
      // Retry in caso di rendering asincrono dell'header del gioco
      setTimeout(attachHubTriggerToIframe, 800);
      setTimeout(attachHubTriggerToIframe, 2000);
    }

    window.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
